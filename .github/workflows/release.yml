name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # goreleaser needs the full history and tags for the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      # A tag must never publish binaries from a commit that fails its own
      # tests. CI runs on master too, but a tag can point anywhere.
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@v0.23.0

      - name: Test
        run: go test -race ./...

      # The release body is generated from Conventional Commit subjects,
      # grouped by type (see `changelog` in .goreleaser.yaml).
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Keep the flake's `gopyter-release` input on the newest tag. Without it,
  # `nix profile install github:mark3labs/gopyter` would install whatever the
  # default branch holds instead of a release: a flake input cannot say
  # "latest tag", so flake.nix pins a tag and this job moves the pin.
  nix-release-pin:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ github.event_name == 'push' && needs.release.result == 'success' }}
    permissions:
      contents: write
    # The release is out either way at this point — the pin bump is a
    # follow-up convenience for Nix users, so a failure here (a push race
    # with a commit that landed first, say) must not turn the release red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          # The pin lives on the default branch, not on the release tag this
          # run was triggered from.
          ref: master
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Point the flake pin at the new release
        env:
          FULL_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/bump-flake-release-pin.sh "$FULL_TAG"
          # The release may ship different Go dependencies, in which case the
          # vendored-module hash has to move with the pin.
          ./scripts/update-flake-vendor-hash.sh
          if git diff --quiet flake.nix; then
            echo "flake.nix already pins $FULL_TAG"
            exit 0
          fi
          git add flake.nix
          git commit -m "chore(nix): pin flake to ${FULL_TAG} [skip ci]"
          git push origin master
